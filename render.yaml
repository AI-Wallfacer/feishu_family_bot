services:
  - type: web
    name: feishu-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: BOT_DB_PATH
        sync: false
      - key: AI_API_BASE
        sync: false
      - key: AI_KEY_CLAUDE
        sync: false
      - key: AI_BASE_CLAUDE
        sync: false
      - key: AI_KEY_CODEX
        sync: false
      - key: AI_BASE_CODEX
        sync: false
      - key: AI_KEY_CN
        sync: false
      - key: AI_BASE_CN
        sync: false
      - key: AI_KEY_GEMINI
        sync: false
      - key: AI_BASE_GEMINI
        sync: false
      - key: AI_MAX_TOKENS
        sync: false
      - key: AI_MODELS_CODEX
        sync: false
      - key: AI_MODELS_GEMINI
        sync: false
      - key: QUEUE_MAX_PENDING
        sync: false
      - key: QUEUE_STALE_SECONDS
        sync: false
      - key: BOT_TIMEZONE
        sync: false
      - key: SCHEDULER_POLL_SECONDS
        sync: false
